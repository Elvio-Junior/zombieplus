name: Playwright CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    name: E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: zombieplus
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d zombieplus"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      CI: true
      BASE_URL: http://localhost:3000
      BASE_API: http://localhost:3333
      DB_DIALECT: postgres
      DB_HOST: localhost
      DB_NAME: zombieplus
      DB_USER: postgres
      DB_PASS: postgres
      DB_PORT: 5432
      TESULTS_TOKEN: ${{ secrets.TESULTS_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install root dependencies
        run: npm ci

      - name: Install API dependencies
        working-directory: apps/api
        run: npm ci

      - name: Install Web dependencies
        working-directory: apps/web
        run: npm ci

      - name: Initialize database
        working-directory: apps/api
        run: bash db.sh

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Check applications
        run: |
          echo "=== API ==="
          curl -v http://localhost:3333 || true

          echo "=== WEB ==="
          curl -v http://localhost:3000 || true

          echo "=== API LOG ==="
          cat api.log || true

          echo "=== WEB LOG ==="
          cat web.log || true

      - name: Run Playwright tests
        run: npx playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 30

      - name: Upload application logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: application-logs
          path: |
            api.log
            web.log
          retention-days: 7
